<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking Rounds · Bloom in English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf2ff;--card:#ffffff;--ink:#0f2250;--mute:#4f628f;--line:#c7d8f7;--main:#1f4aa8;--main-ink:#ffffff;--sun:#ffd23f;--ok:#17a36b;--hint:#fde3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a3d;--card:#122a5e;--ink:#f2f6ff;--mute:#a9bde6;--line:#2c4a8a;--main:#8fb4ff;--main-ink:#0b1a3d;--hint:#4a2a40}}
:root[data-theme="dark"]{--bg:#0b1a3d;--card:#122a5e;--ink:#f2f6ff;--mute:#a9bde6;--line:#2c4a8a;--main:#8fb4ff;--main-ink:#0b1a3d;--hint:#4a2a40}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:1.15rem;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:2.1rem;line-height:1.1;margin:0}
h1 span{background:var(--sun);color:#1b2340;padding:0 .35em;border-radius:.4em}
.timer{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.3rem;min-width:7.5em}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.btn{background:var(--main);color:var(--main-ink);border:0;border-radius:999px;padding:.55em 1.2em;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.tab{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.5em .3em;font-weight:700;font-size:.95rem;line-height:1.2}
.tab small{display:block;font-weight:400;color:var(--mute)}
.tab[aria-selected="true"]{border-color:var(--main);box-shadow:0 4px 0 var(--main)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:24px 22px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.95rem;margin-bottom:10px}
.chip{display:inline-block;background:var(--sun);color:#1b2340;font-weight:800;border-radius:999px;padding:0 .7em;font-size:.85rem;margin-right:6px}
.q{font-family:"Baloo 2",sans-serif;font-weight:600;font-size:1.7rem;line-height:1.25;margin:6px 0 18px}
.opts{display:grid;gap:10px}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:.7em 1em;text-align:left;font-weight:700}
.opt.on{border-color:var(--main);background:var(--main);color:var(--main-ink)}
.opt.tf.on{background:var(--ok);border-color:var(--ok);color:#fff}
.say{background:var(--hint);border-radius:14px;padding:.8em 1em;margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.spacer{flex:1}
.hide{display:none}
ul.qs{padding-left:1.1em;margin:0 0 6px}
ul.qs li{margin:.5em 0;font-weight:700}
.listen{background:none;border:2px solid var(--line);border-radius:999px;padding:.2em .8em;font-size:.9rem}
input{font:inherit;width:100%;padding:.6em .8em;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:6px 0 12px}label{font-weight:700;display:block}.big{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:2.4rem;text-align:center;margin:14px 0}.flip{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;background:var(--bg);border:2px dashed var(--line);border-radius:18px;padding:20px}.bad{color:#d6336c;font-weight:700;margin:0}.brand{display:flex;flex-direction:column;line-height:1.15;margin-bottom:12px}.brand small{color:var(--mute);font-size:.85rem}.brand b{font-family:"Baloo 2",sans-serif;font-size:1.3rem;color:var(--main)}footer{margin-top:28px;text-align:center;color:var(--mute);font-size:.9rem}@media (max-width:520px){h1{font-size:1.7rem}.q{font-size:1.4rem}.big{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><small>🌼 Bloom in English</small><b>with Teacher Jessy</b></div>
<header>
<h1>Speaking <span>Rounds</span></h1>
<div><span class="timer" id="timer" aria-live="polite">⏱ Ready</span> <button class="btn ghost" id="tbtn">Start 30 s</button></div>
</header>
<div class="tabs" role="tablist" id="tabs"></div>
<main class="card" id="view"></main>
<footer>Bloom in English · with Teacher Jessy · @teacherjessys</footer>
</div>
<script>
const R=[
{t:"My real life",s:"CAN · COULD · SHOULD",type:"list",
 intro:"Answer, then ask one follow-up question.",
 sets:{"Free time":[["CAN","What can you do to relax after work?"],["CAN","Can you spend a whole weekend at home?"],["COULD","What could you do more often if you had more free time?"]],
 "Work":[["CAN","What can you do well at work?"],["COULD","What could make your workday better?"],["SHOULD","What should you do when you feel tired at work?"]]}},
{t:"Choose your life",s:"WOULD",type:"choice",
 items:[{h:"Extra money",q:"You receive an unexpected R$ 2,000. What would you do?",o:["Buy something I’ve wanted","Save the money","Travel somewhere","Pay my bills"]},
 {h:"Big prize",q:"Imagine you won R$ 500,000. What would you do?",o:["I would buy a house","I would travel around the world","I would buy my dream car","I would invest the money"]},
 {h:"This or that",q:"Would you rather work four days a week or have a longer vacation?",o:["Work four days a week","Have a longer vacation","Both, please!","Neither"]}]},
{t:"What would you do?",s:"WOULD · SHOULD · CAN · COULD",type:"sit",
 items:[{h:"You missed your flight",d:"You arrived late at the airport, and your plane has already left.",qs:["What would you do?","What could you do to solve the problem?","What should you do differently next time?"],help:["talk to the airline","buy another ticket","call someone"]},
 {h:"Your team is playing a final",d:"Your team is playing an important final, but you have to work that day.",qs:["Would you try to watch the game?","What could you do?","Should you ask someone to change your schedule?"],help:["watch it on my phone","ask my manager","watch the replay"]},
 {h:"You want something expensive",d:"You want to buy a new TV, but you’re trying to save money.",qs:["Would you buy it now?","What should you do?","What could happen if you spent too much money?"],help:["buy it now","wait for a sale","save more money"]}]},
{t:"True or false?",s:"All modals",type:"tf",
 items:["I can cook very well.","I couldn’t ride a bike when I was five.","I should exercise more.","I would love to travel to Japan.","I must wake up early tomorrow.","I wouldn’t live in a very cold country.","I can watch football for hours."]},
{t:"2 truths, 1 lie",s:"Find the lie",type:"tl"},
{t:"Spin & speak",s:"Modal + topic",type:"spin"},
{t:"Topic generator",s:"A2 · B1",type:"topic",lv:{A2:["Describe your favorite food. Why do you like it?","What do you do on weekends?","Talk about your best friend.","What is your morning routine?","Describe your house or apartment.","What sports do you like?","Talk about your last vacation.","What can you cook?"],B1:["What would you change about your city?","Talk about a time you learned something difficult.","Is it better to live in a big city or a small town? Why?","What should people do to be healthier?","Describe a trip you would love to take.","How has technology changed your life?","What must you do to be successful at work?","Talk about a decision that changed your life."]}},
{t:"Flashcards",s:"Vocabulary",type:"flash",items:[["work out","malhar / se exercitar","I can work out at the gym."],["save money","economizar dinheiro","You should save money."],["invest","investir","I would invest the money."],["dream car","carro dos sonhos","I would buy my dream car."],["seat belt","cinto de segurança","You must wear a seat belt."],["arrive on time","chegar na hora","You must arrive on time."],["bills","contas","I would pay my bills."],["schedule","horário / agenda","Ask to change your schedule."],["replay","reprise","I could watch the replay."],["wait for a sale","esperar uma promoção","You should wait for a sale."]]},
{t:"Grammar quiz",s:"Modals",type:"quiz",items:[["When I was five, I ___ ride a bike. Now I can!",["can’t","couldn’t","must"],1,"Past ability: could / couldn’t."],["You are very tired. You ___ go to bed early.",["should","mustn’t","can"],0,"Advice: should."],["If I won the lottery, I ___ travel the world.",["can","would","must"],1,"Imaginary situations: would."],["At the airport, you ___ show your passport.",["could","would","must"],2,"Strong obligation: must."],["You ___ use your phone while you drive.",["mustn’t","should","would"],0,"Prohibition: mustn’t."],["___ you swim when you were a child?",["Can","Could","Should"],1,"Past ability: could."],["My friend wants to learn English. He ___ practice every day.",["should","mustn’t","can’t"],0,"Advice: should."],["Which sentence is correct?",["She can to cook.","She can cook.","She cans cook."],1,"After a modal, use the base verb (no “to”)."]]}
];
const $=s=>document.querySelector(s),view=$("#view"),tabs=$("#tabs");
let cur=0,i=0,topic=null,pick=null,stuck=false,flipped=false,sc=0,tq="",tl=null,tlAns=null,spinR=null;
const MOD=/\b(can|could|should|would|must)\b/i,rnd=a=>a[Math.floor(Math.random()*a.length)],M=["CAN","COULD","SHOULD","WOULD","MUST"],TP=["food","travel","work","football","money","the weekend","technology","family","health","music"],ST={CAN:"I can …",COULD:"When I was a child, I could …",SHOULD:"People should …",WOULD:"If I had more time, I would …",MUST:"Everyone must …"};
function esc(x){return x.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function nav(n){return `<div class="row"><button class="btn ghost" data-a="prev"${i===0?" disabled":""}>Previous</button><span class="spacer"></span><button class="btn" data-a="next">${i===n-1?"Start over":"Next"}</button></div>`}
function drawTabs(){tabs.innerHTML=R.map((r,k)=>`<button class="tab" role="tab" aria-selected="${k===cur}" data-tab="${k}">${r.t}<small>${r.s}</small></button>`).join("")}
function draw(){
 const r=R[cur];let h="";
 if(r.type==="list"){
  const names=Object.keys(r.sets);topic=topic||names[0];const L=r.sets[topic];
  h+=`<div class="row" style="margin-top:0">${names.map(n=>`<button class="opt${n===topic?" on":""}" data-topic="${n}">${n}</button>`).join("")}</div>`;
  const [m,q]=L[i%L.length];
  h+=`<div class="meta" style="margin-top:16px"><span>Question ${i%L.length+1} of ${L.length}</span></div><span class="chip">${m}</span><p class="q">${q}</p><button class="listen" data-say="${esc(q)}">🔊 Listen</button><div class="say">${r.intro}</div>`;
  h+=nav(L.length);
 }
 if(r.type==="choice"){
  const x=r.items[i];
  h+=`<div class="meta"><span>Situation ${i+1} of ${r.items.length}</span><span>${x.h}</span></div><p class="q">${x.q}</p><div class="opts">${x.o.map((o,k)=>`<button class="opt${pick===k?" on":""}" data-pick="${k}">${o}</button>`).join("")}</div>`;
  if(pick!==null)h+=`<div class="say"><b>Explain your choice:</b> “I would … because …” Say one or two sentences!</div>`;
  h+=nav(r.items.length);
 }
 if(r.type==="sit"){
  const x=r.items[i];
  h+=`<div class="meta"><span>Situation ${"ABC"[i]}</span></div><p class="q">${x.h}</p><p>${x.d}</p><ul class="qs">${x.qs.map(q=>`<li>${q}</li>`).join("")}</ul>`;
  h+=`<button class="btn ghost" data-a="stuck">${stuck?"Hide help":"I’m stuck 🆘"}</button>`;
  if(stuck)h+=`<div class="say"><b>Try one of these:</b> ${x.help.join(" / ")}</div>`;
  h+=nav(r.items.length);
 }
 if(r.type==="tf"){
  const x=r.items[i];
  h+=`<div class="meta"><span>Sentence ${i+1} of ${r.items.length}</span><span>Guess!</span></div><p class="q">${x}</p><div class="opts" style="grid-template-columns:1fr 1fr"><button class="opt tf${pick==="t"?" on":""}" data-pick="t">True ✅</button><button class="opt tf${pick==="f"?" on":""}" data-pick="f">False ❌</button></div>`;
  if(pick)h+=`<div class="say"><b>Now ask:</b> “Why do you think so?” or “Tell me more!”</div>`;
  h+=`<div class="say" style="background:var(--bg);border:2px dashed var(--line)"><b>Your turn:</b> make your own sentence with can, could, should, would or must.</div>`;
  h+=nav(r.items.length);
 }
 if(r.type==="tl"){
  if(!tl){h+=`<p class="q">Write 3 sentences about you. Use a modal in each one!</p><p>Two are true, one is a lie. Can your teacher find it?</p><div class="row" style="margin:0 0 14px">${["can","could","should","would","must"].map(m=>`<span class="chip">${m}</span>`).join("")}</div>`;
   ["Sentence 1","Sentence 2","Sentence 3"].forEach((l,k)=>h+=`<label>${l}<input id="tl${k}" placeholder="${["I can …","I couldn’t … when I was …","I would love to …"][k]}"></label>`);
   h+=`<p class="bad" id="tlmsg" role="alert"></p><div class="row"><button class="btn" data-a="tlgo">Play</button></div>`}
  else{h+=`<p class="q">Which one is the lie?</p><div class="opts">${tl.map((s,k)=>`<button class="opt${tlAns===k?" on":""}" data-tl="${k}">${esc(s.t)}</button>`).join("")}</div>`;
   if(tlAns!==null)h+=`<div class="say"><b>Your guess!</b> Ask: “Is it the lie? Why do you think so?” Then say the answer out loud.</div>`;
   h+=`<div class="row"><button class="btn ghost" data-a="tlreset">New round</button></div>`}
 }
 if(r.type==="spin"){const x=spinR;h+=`<p class="q">Spin the wheel, then speak!</p><div class="big">${x?`<span class="chip" style="font-size:1.2rem">${x[0]}</span> ${x[1]}`:"🎡"}</div>`;
  if(x)h+=`<div class="say">Say 2 or 3 sentences about <b>${x[1]}</b> using <b>${x[0].toLowerCase()}</b>. Start with: “${ST[x[0]]}”</div>`;
  h+=`<div class="row"><button class="btn" data-a="spin">Spin 🎡</button><button class="btn ghost" data-a="timer">Start 30 s</button></div>`}
 if(r.type==="topic"){const lv=topic&&r.lv[topic]?topic:"A2";h+=`<div class="row" style="margin-top:0">${Object.keys(r.lv).map(n=>`<button class="opt${n===lv?" on":""}" data-topic="${n}">${n}</button>`).join("")}</div><p class="q" style="margin-top:20px">${tq||"Press the button to get a topic!"}</p><div class="row"><button class="btn" data-a="newtopic">New topic 🎲</button>${tq?`<button class="listen" data-say="${esc(tq)}">🔊 Listen</button>`:""}</div>`}
 if(r.type==="flash"){const c=r.items[i];h+=`<div class="meta"><span>Card ${i+1} of ${r.items.length}</span><span>Tap the card to flip</span></div><button class="flip" data-a="flip" aria-label="Flip card"><div>${flipped?`<div class="q" style="margin:0">${c[1]}</div>`:`<div class="q" style="margin:0 0 6px">${c[0]}</div><div style="color:var(--mute)">${c[2]}</div>`}</div></button><div class="row" style="margin-top:12px"><button class="listen" data-say="${esc(c[0])}">🔊 Listen</button></div>`;h+=nav(r.items.length)}
 if(r.type==="quiz"){if(i>=r.items.length){h+=`<p class="q">Score: ${sc} / ${r.items.length} 🎉</p><div class="row"><button class="btn" data-a="restart">Play again</button></div>`}else{const x=r.items[i];h+=`<div class="meta"><span>Question ${i+1} of ${r.items.length}</span><span>Score ${sc}</span></div><p class="q">${x[0]}</p><div class="opts">${x[1].map((o,k)=>`<button class="opt${pick===k?" on":""}" data-pick="${k}">${o}</button>`).join("")}</div>`;
  if(pick!==null)h+=`<div class="say">${pick===x[2]?"<b>Correct!</b>":"<b>Not quite.</b> Answer: "+x[1][x[2]]+"."} ${x[3]}</div><div class="row"><button class="btn" data-a="qnext">${i===r.items.length-1?"See score":"Next"}</button></div>`}}
 view.innerHTML=h;
}
function total(){const r=R[cur];return r.type==="list"?r.sets[topic||Object.keys(r.sets)[0]].length:r.items.length}
tabs.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;cur=+b.dataset.tab;i=0;pick=null;stuck=false;topic=null;sc=0;flipped=false;tq="";drawTabs();draw()});
view.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.topic){topic=t.dataset.topic;i=0}
 else if(t.dataset.pick!==undefined){if(R[cur].type==="quiz"){if(pick!==null)return;pick=+t.dataset.pick;if(pick===R[cur].items[i][2])sc++}else pick=isNaN(t.dataset.pick)?t.dataset.pick:+t.dataset.pick}
 else if(t.dataset.say){speak(t.dataset.say);return}
 else if(t.dataset.a==="stuck"){stuck=!stuck}
 else if(t.dataset.a==="flip"){flipped=!flipped}
 else if(t.dataset.a==="timer"){$("#tbtn").click();return}
 else if(t.dataset.tl!==undefined){tlAns=+t.dataset.tl}
 else if(t.dataset.a==="tlreset"){tl=null;tlAns=null}
 else if(t.dataset.a==="tlgo"){const v=[0,1,2].map(k=>$("#tl"+k).value.trim());const bad=v.findIndex(x=>!x||!MOD.test(x));if(bad>-1){$("#tlmsg").textContent="Sentence "+(bad+1)+" needs a modal: can, could, should, would or must.";return}tl=v.map(s=>({t:s}));tlAns=null}
 else if(t.dataset.a==="spin"){let n=0;const iv=setInterval(()=>{spinR=[rnd(M),rnd(TP)];draw();if(++n>10)clearInterval(iv)},90);return}
 else if(t.dataset.a==="newtopic"){const L=R[cur].lv[topic&&R[cur].lv[topic]?topic:"A2"];let q;do{q=rnd(L)}while(q===tq);tq=q}
 else if(t.dataset.a==="qnext"){i++;pick=null}
 else if(t.dataset.a==="restart"){i=0;sc=0;pick=null}
 else if(t.dataset.a==="next"){i=(i+1)%total();pick=null;stuck=false;flipped=false}
 else if(t.dataset.a==="prev"){i=Math.max(0,i-1);pick=null;stuck=false;flipped=false}
 draw();
});
let tm=null,left=0;
$("#tbtn").addEventListener("click",()=>{
 clearInterval(tm);left=30;$("#timer").textContent="⏱ 30 s";
 tm=setInterval(()=>{left--;$("#timer").textContent=left>0?"⏱ "+left+" s":"⏱ Time’s up!";if(left<=0)clearInterval(tm)},1000);
});
drawTabs();draw();
</script>
</body>
</html>
